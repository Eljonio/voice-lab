<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слепое прослушивание</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--mut:#5d6673;--line:#dfe3e8;--acc:#1F5BFF;--acc2:#e8eeff;--ok:#1a7f37;--okbg:#e6f4ea;--warn:#b42318;--chip:#eef1f5;--warnbg:#fdecea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#171b21;--fg:#e8ebef;--mut:#9aa3ae;--line:#2a3039;--acc:#5b8cff;--acc2:#1c2740;--ok:#4cc26a;--okbg:#16301f;--warn:#ff7b6b;--chip:#222832;--warnbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#171b21;--fg:#e8ebef;--mut:#9aa3ae;--line:#2a3039;--acc:#5b8cff;--acc2:#1c2740;--ok:#4cc26a;--okbg:#16301f;--warn:#ff7b6b;--chip:#222832;--warnbg:#3a1d1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 100px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:18px;margin:26px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card.done{border-left:4px solid var(--ok)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:14px;color:var(--mut)}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--chip);font:13px ui-monospace,monospace;text-align:center;color:var(--fg)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.text{font-size:20px;margin:6px 0 10px;flex:1;min-width:220px}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--acc2);border-color:var(--acc)}
button.good.on{background:var(--okbg);border-color:var(--ok)}
button.bad.on{background:var(--warnbg);border-color:var(--warn)}
button.play{min-width:46px}
button.play.playing{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:5px 10px;font-size:14px}
.chips .lab{font-size:13px;color:var(--mut);align-self:center;min-width:64px}
.letters button{min-width:38px;font-size:16px}
input[type=text],textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:8px;margin-top:8px}
textarea{min-height:60px}
details summary{cursor:pointer;color:var(--mut)}
.src{font-size:13px;color:var(--mut);margin-top:6px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.foot .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hid{display:none}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div class="mut" id="intro"></div>
<div class="card keys">
  <div><kbd>Пробел</kbd> играть / пауза (A/B: исходник → нарезка)</div>
  <div><kbd>↓</kbd> / <kbd>↑</kbd> следующая / прошлая</div>
  <div><kbd>R</kbd> ещё раз</div>
  <div id="keyhint"></div>
</div>
<div class="bar"><i id="pbar"></i></div>
<div id="list"></div>
<details class="card" id="numsbox"><summary>Цифры (открыть после прослушивания, чтобы не подсказывали)</summary><div id="nums"></div></details>
<div class="card"><div class="mut">Общий комментарий (по желанию)</div><textarea id="note"></textarea></div>
</main>
<div class="foot"><div class="in">
  <button class="primary" id="dl">Скачать ответы</button>
  <span id="status" class="mut"></span>
</div></div>
<script>
const DATA = /*DATA*/null;
const LS = DATA.ls_key;
document.getElementById("title").textContent = DATA.title;
document.title = DATA.title;
document.getElementById("intro").textContent = DATA.intro;
document.getElementById("keyhint").innerHTML = DATA.keyhint || "";
let S = {items: {}, note: "", started: new Date().toISOString(), finished: null, downloaded: false};
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s && s.items) S = Object.assign(S, s); } catch (e) {}
const audio = new Audio();
let cur = 0;
function rec(id) { return S.items[id] || (S.items[id] = {}); }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} status(); }
function qsFor(it) { return (DATA.questions || []).filter(q => (!q.ab || it.b) && (!q.grp || q.grp === it.grp)); }
function isDone(id) { const r = S.items[id] || {}, it = DATA.items.find(x => x.id === id) || {};
  if (DATA.kind === "limp") return (r.tags || []).length > 0;
  const req = qsFor(it).filter(q => q.req);
  if (req.length) return req.every(q => q.multi ? (r[q.id] || []).length > 0 : !!r[q.id]);
  return !!(r.lang && r.keep && (!it.b || (r.cut || []).length)); }
function status() {
  const n = DATA.items.filter(it => isDone(it.id)).length;
  document.getElementById("status").textContent = `отмечено ${n}/${DATA.items.length}` + (S.downloaded ? " · файл скачан" : "");
  document.getElementById("pbar").style.width = (n / DATA.items.length * 100) + "%";
  if (n === DATA.items.length && !S.downloaded) { S.finished = new Date().toISOString(); download(); }
}
let seq = [], seqT = null;
function play(i, restart, which) {
  const it = DATA.items[i]; if (!it) return;
  which = which || "a";
  const w = which.replace("only", ""), key = it.id + "_" + w;
  clearTimeout(seqT); seq = [];
  const same = audio.dataset.id === key;
  document.querySelectorAll(".play").forEach(b => b.classList.remove("playing"));
  if (same && !audio.paused && !restart) { audio.pause(); return; }
  if (!same || restart) { audio.src = it[w]; audio.dataset.id = key; audio.currentTime = 0; }
  audio.play().catch(() => {});
  const b = document.getElementById("pl_" + key); if (b) b.classList.add("playing");
}
function start(i) { const it = DATA.items[i]; if (it && it.b) playAB(i); else play(i, true, "onlya"); }
function playAB(i) {   // исходник, пауза 0,6 с, наша нарезка
  play(i, true, "onlya"); seq = [() => play(i, true, "onlyb")];
}
audio.onended = () => { document.querySelectorAll(".play").forEach(b => b.classList.remove("playing")); const f = seq.shift(); if (f) seqT = setTimeout(f, 600); };
audio.onpause = () => document.querySelectorAll(".play").forEach(b => b.classList.remove("playing"));
function setCur(i, scroll) {
  cur = Math.max(0, Math.min(DATA.items.length - 1, i));
  document.querySelectorAll(".card.item").forEach((c, k) => c.classList.toggle("cur", k === cur));
  if (scroll) document.getElementById("it_" + DATA.items[cur].id).scrollIntoView({block: "center", behavior: "smooth"});
}
// ---------------- «где хромает»: теги, буквы, слово
function toggleTag(id, tag) {
  const r = rec(id); r.tags = r.tags || [];
  const j = r.tags.indexOf(tag);
  if (tag === "ok") r.tags = j >= 0 ? [] : ["ok"];
  else { r.tags = r.tags.filter(t => t !== "ok"); if (j >= 0) r.tags.splice(r.tags.indexOf(tag), 1); else r.tags.push(tag); }
  if (!r.tags.includes("letter")) r.letters = [];
  r.t = new Date().toISOString(); save(); renderItem(id);
}
function toggleLetter(id, L) { const r = rec(id); r.letters = r.letters || []; const j = r.letters.indexOf(L);
  if (j >= 0) r.letters.splice(j, 1); else r.letters.push(L); save(); renderItem(id); }
function setField(id, k, v) { rec(id)[k] = v; save(); }
// ---------------- «новые данные»: язык, звук, брать
function setOne(id, k, v) { const r = rec(id); r[k] = r[k] === v ? null : v; r.t = new Date().toISOString(); save(); renderItem(id); }
function toggleMany(id, k, v) { const r = rec(id); r[k] = r[k] || []; const j = r[k].indexOf(v);
  const q = DATA.questions.find(x => x.id === k) || {options: []}, ex = new Set(q.options.filter(o => o.excl).map(o => o.id));
  if (j >= 0) r[k].splice(j, 1);
  else if (ex.has(v)) r[k] = [v];
  else { r[k] = r[k].filter(x => !ex.has(x)); r[k].push(v); }
  r.t = new Date().toISOString(); save(); renderItem(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function body(it, i) {
  const r = S.items[it.id] || {};
  const btn = it.b ? `<button class="play" id="pl_${it.id}_a" onclick="setCur(${i}); play(${i}, true, 'onlya')">▶ ${esc(it.la || "исходник")}</button>
    <button class="play" id="pl_${it.id}_b" onclick="setCur(${i}); play(${i}, true, 'onlyb')">▶ ${esc(it.lb || "нарезка")}</button>
    <button onclick="setCur(${i}); playAB(${i})" title="исходник, потом нарезка">A→B</button>`
    : `<button class="play" id="pl_${it.id}_a" onclick="setCur(${i}); play(${i})">▶</button>`;
  let h = `<div class="top">${btn}
    <span class="num">${i + 1}/${DATA.items.length}${it.cat ? " · " + esc(it.cat) : ""}${it.dur ? " · " + it.dur + " с" : ""}</span>
    ${it.text ? `<div class="text">${esc(it.text)}</div>` : ""}</div>`;
  if (DATA.kind === "limp") {
    const tags = r.tags || [];
    h += `<div class="chips">${DATA.tags.map((t, k) => `<button class="${t.id === "ok" ? "good" : "bad"} ${tags.includes(t.id) ? "on" : ""}"
      onclick="setCur(${i}); toggleTag('${it.id}', '${t.id}')">${k + 1}. ${esc(t.label)}</button>`).join("")}</div>`;
    if (tags.includes("letter")) h += `<div class="chips letters"><span class="lab">какая:</span>${DATA.letters.map(L =>
      `<button class="bad ${(r.letters || []).includes(L) ? "on" : ""}" onclick="toggleLetter('${it.id}', '${L}')">${esc(L)}</button>`).join("")}</div>`;
    if (tags.length && !tags.includes("ok")) h += `<input type="text" placeholder="какое слово и как надо (по желанию)" value="${esc(r.word || "")}"
      oninput="setField('${it.id}', 'word', this.value)">`;
  } else {
    for (const q of qsFor(it)) {
      const multi = q.multi, val = r[q.id];
      h += `<div class="chips"><span class="lab">${esc(q.label)}</span>${q.options.map(o => {
        const on = multi ? (val || []).includes(o.id) : val === o.id;
        return `<button class="${o.good ? "good" : o.bad ? "bad" : ""} ${on ? "on" : ""}" onclick="setCur(${i}); ${multi ? "toggleMany" : "setOne"}('${it.id}', '${q.id}', '${o.id}')">${esc(o.label)}</button>`;
      }).join("")}</div>`;
    }
    h += `<input type="text" placeholder="${esc(it.ph || "что не так / что слышно (по желанию)")}" value="${esc(r.word || "")}" oninput="setField('${it.id}', 'word', this.value)">`;
    if (it.src) h += `<details class="src"><summary>откуда</summary>${esc(it.src)}</details>`;
  }
  return h;
}
function renderItem(id) {
  const i = DATA.items.findIndex(x => x.id === id), el = document.getElementById("it_" + id);
  el.innerHTML = body(DATA.items[i], i); el.classList.toggle("done", isDone(id));
}
function render() {
  let prevSec = null;
  document.getElementById("list").innerHTML = DATA.items.map((it, i) => {
    let h = "";
    if (it.section && it.section !== prevSec) { prevSec = it.section;
      h += `<h2>${esc(it.section)}</h2>${it.section_note ? `<div class="mut">${esc(it.section_note)}</div>` : ""}`; }
    return h + `<div class="card item" id="it_${it.id}"></div>`; }).join("");
  DATA.items.forEach(it => renderItem(it.id));
  document.getElementById("nums").innerHTML = DATA.nums_html || "<div class='mut'>—</div>";
  if (!DATA.nums_html) document.getElementById("numsbox").classList.add("hid");
  setCur(0, false); status();
}
function download() {
  S.note = document.getElementById("note").value;
  const out = Object.assign({page: LS, kind: DATA.kind, meta: DATA.meta || {}, saved: new Date().toISOString()}, S);
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `${LS}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`; a.click();
  S.downloaded = true; save();
}
document.getElementById("dl").onclick = download;
document.getElementById("note").value = S.note || "";
document.getElementById("note").oninput = e => { S.note = e.target.value; save(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const it = DATA.items[cur];
  if (e.code === "Space") { e.preventDefault(); if (!audio.paused) { seq = []; audio.pause(); } else start(cur); }
  else if (e.code === "KeyR") start(cur);
  else if (e.code === "KeyA" && it && it.b) play(cur, true, "onlya");
  else if (e.code === "KeyB" && it && it.b) play(cur, true, "onlyb");
  else if (e.code === "ArrowDown") { e.preventDefault(); setCur(cur + 1, true); start(cur); }
  else if (e.code === "ArrowUp") { e.preventDefault(); setCur(cur - 1, true); start(cur); }
  else if (DATA.kind === "limp" && /^Digit[1-9]$/.test(e.code) && it) { const t = DATA.tags[+e.code.slice(5) - 1]; if (t) toggleTag(it.id, t.id); }
});
render();
</script>
</body>
</html>
