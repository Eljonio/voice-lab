# v3 (09.10, решение после слепого A/B пробы: B лучше A 6/6): расширенная LoRA как проба B — r=128, α=128, LoRA на внимании, MLP
# (gate/up/down) и проекциях LM↔DiT, lr 1e-4, warmup 200, эфф. батч 16. Смесь mix-v3b (148,9 ч, все проверки пройдены).
# 2 эпохи ≈ 6 068 шагов (cosine на все шаги); снимок и val каждые 1 000 шагов — выбор снимка ушами (val-лосс не различает).
# Чекпоинты на загрузочном диске (RUNDIR; на постоянном диске ~10 ГБ), в конце LoRA-веса снимков копируются на постоянный диск.
pretrained_path: VOICE_HOME/weights/VoxCPM2/
train_manifest: VOICE_HOME/MIX/train.jsonl
val_manifest: VOICE_HOME/MIX/val.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 8
grad_accum_steps: 2
num_workers: 12
preprocessing_num_workers: 12
num_iters: STEPS
max_steps: STEPS
log_interval: 20
valid_interval: 1000
save_interval: 1000
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 200
max_batch_tokens: 16384
max_grad_norm: 1.0
save_path: RUNDIR
tensorboard: RUNDIR/tb
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: true
  r: 128
  alpha: 128
  dropout: 0.0
  target_modules_lm: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  target_modules_dit: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
